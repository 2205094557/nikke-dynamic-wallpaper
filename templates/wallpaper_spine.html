<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
================================================================================
 NIKKE《胜利女神：NIKKE》Spine 壁纸导出模板（由既有 4.1 模板精简改造）
--------------------------------------------------------------------------------
 运行时：spine-webgl 4.0 / 4.1 UMD（随壁纸项目导出，模板内 {{SPINE_RUNTIME}} 由
 导出器按该皮肤 skel 头部版本号选择对应运行时文件）。
 资产：单角色单骨架（main 主立绘 / aim / cover 三姿势导出其一），base64 内联。
 NIKKE 贴图为预乘 alpha（atlas 页头 pma:true）：
   - 上传原样直传（UNPACK_PREMULTIPLY_ALPHA_WEBGL=false），
   - drawSkeleton(skeleton, true) 按预乘混合（ONE / ONE_MINUS_SRC_ALPHA）绘制。
   （直通 alpha 的 BD2 模板此处为 true——与 NIKKE 相反，改模板必看。）
 保留的通用机制：bestSkin（选附件最多的 skin）、取景三层链（computeBounds →
 contentFrame → denseAreaFrame）、16:9 布局单一事实来源 wallpaper-layout.js、
 wallpaperPropertyListener（首推无条件跳过版式，只采纳缩放/偏移/对齐）、
 动画选择（导出内联 ANIMATION，默认按 idle/normal 自动选）。
 已删除（NIKKE 无）：互动引擎（drag/touch/mix/_faceN）、互动语音（CriWare/FEV）、
 开场 login 状态机、cutscene 独立背景图/多阶段背景组。
================================================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; }
  #bg-layer { position: fixed; inset: 0; z-index: 0; {{BG_CSS}} }
  #canvas { display: block; width: 100vw; height: 100vh; background: transparent; position: relative; z-index: 1; opacity: 0; transition: opacity .8s; }
  #canvas.ready { opacity: 1; }
</style>
</head>
<body>
<div id="bg-layer"></div>
<canvas id="canvas"></canvas>
<!-- Spine 运行时：随壁纸项目一起导出（离线可用，不依赖 CDN）。 -->
<script src="{{SPINE_RUNTIME}}"></script>
<script src="wallpaper-layout.js"></script>
<script>
// ===== 皮肤配置（导出器注入） =====
var LAYERS = {{LAYERS_JSON}};   // [{ name, skelData(base64), atlasText, textures:[{page,file}] }]
var SCALE = {{SCALE}};          // 百分比：100 = 自适应（20~300）
var OFFSET_X = {{OFFSET_X}};    // 画布宽 %
var OFFSET_Y = {{OFFSET_Y}};    // 画布高 %
var CHAR_OFFSET_X = {{CHAR_OFFSET_X}}; // 角色独立偏移（只移骨架，背景不动）：画布宽 %
var CHAR_OFFSET_Y = {{CHAR_OFFSET_Y}}; // 角色独立偏移：画布高 %
var ALIGNMENT = "{{ALIGNMENT}}"; // center / left-top / right-top / left-bottom / right-bottom
var ANIMATION = {{ANIMATION}};  // 导出的初始动画名（空则按 idle/normal 自动选择）

// NIKKE 贴图是预乘 alpha（atlas pma:true）：原样直传 + 预乘混合绘制。
// 若改回直通 alpha（pma:false），此开关需置 true 并按 BD2 模板验证浅色背景不发白。
var NIKKE_PREMULTIPLY_UPLOAD = false;

var canvas = document.getElementById("canvas");
var gl = null, renderer = null;
var skeletons = [], pending = new Array(LAYERS.length);
var loadedCount = 0, lastFrame = 0;
var boundsCache = null;

function currentAnimName() {
  for (var i = 0; i < skeletons.length; i++) {
    var l = skeletons[i];
    if (!l || !l.state) continue;
    var e = l.state.getCurrent(0);
    if (e && e.animation) return e.animation.name;
  }
  return "";
}

function showError(msg) { console.error(msg); document.title = "ERR " + msg; }

// 选附件最多的 skin：default 优先，同数时保持 default；遍历计数（不含透明插槽与位置标记）。
function bestSkin(data) {
  var skins = data.skins || [];
  if (skins.length <= 1) return data.defaultSkin || skins[0];
  var best = data.defaultSkin || skins[0];
  var bestCount = -1;
  for (var si = 0; si < skins.length; si++) {
    var sk = skins[si];
    var count = 0;
    var skel = new spine.Skeleton(data);
    skel.setSkin(sk);
    skel.setSlotsToSetupPose();
    skel.updateWorldTransform();
    for (var s2 = 0; s2 < skel.slots.length; s2++) {
      var slot = skel.slots[s2], att = slot.getAttachment();
      if (!att) continue;
      if (slot.color && slot.color.a < 0.01) continue;
      if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
      count++;
    }
    if (count > bestCount) {
      bestCount = count;
      best = sk;
    }
  }
  return best;
}

function loadLayer(idx) {
  var cfg = LAYERS[idx];
  var texMap = {};
  var remaining = cfg.textures.length;
  function start() {
    try {
      var glTex = {};
      // 预乘贴图原样上传（与预览 SpinePreview.vue 一致）
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, NIKKE_PREMULTIPLY_UPLOAD);
      Object.keys(texMap).forEach(function (p) { glTex[p] = new spine.GLTexture(gl, texMap[p]); });
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, NIKKE_PREMULTIPLY_UPLOAD);
      var atlas = new spine.TextureAtlas(cfg.atlasText);
      atlas.pages.forEach(function (page) { page.setTexture(glTex[page.name] || glTex[Object.keys(glTex)[0]]); });
      var loader = new spine.AtlasAttachmentLoader(atlas);
      var bin = atob(cfg.skelData);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var data = new spine.SkeletonBinary(loader).readSkeletonData(bytes);
      var skeleton = new spine.Skeleton(data);
      skeleton.setSkin(bestSkin(data));
      skeleton.setSlotsToSetupPose();
      skeleton.updateWorldTransform();
      var state = new spine.AnimationState(new spine.AnimationStateData(data));
      pending[idx] = { skeleton: skeleton, state: state, data: data, name: cfg.name };
    } catch (e) { showError("layer " + cfg.name + ": " + e.message); return; }
    loadedCount++;
    maybeBuildScene();
  }
  if (!remaining) { start(); return; }
  cfg.textures.forEach(function (t) {
    var img = new Image();
    img.onload = function () { texMap[t.page] = img; if (--remaining === 0) start(); };
    img.onerror = function () { showError("texture fail " + t.file); };
    img.src = t.file;
  });
}

var _sceneBuilt = false;
function maybeBuildScene() {
  if (_sceneBuilt) return;
  if (loadedCount >= LAYERS.length) {
    _sceneBuilt = true;
    buildScene();
  }
}

function pickAnim(sd) {
  var names = sd.animations.map(function (a) { return a.name; });
  // 默认动画选择：优先角色常驻的循环/待机（loop_*/idle/normal）
  var loop = names.find(function (n) { return /^loop/i.test(n); });
  var idle = names.find(function (n) { return /idle/i.test(n); });
  var normal = names.find(function (n) { return n === "normal"; });
  return loop || idle || normal || names[0] || "";
}

function playAnim(name) {
  if (!skeletons.length) return;
  var shared = name || pickAnim(skeletons[0].data);
  skeletons.forEach(function (l) {
    if (!shared) return;
    if (!l.data.animations.some(function (a) { return a.name === shared; })) {
      var fb = pickAnim(l.data);
      if (fb) l.state.setAnimation(0, fb, true);
      return;
    }
    l.state.clearTrack(1);
    l.state.setAnimation(0, shared, true);
  });
}

// 角色点击互动状态机（首击 action -> 随机表情池 -> 播完重置为 action 循环）
var ENABLE_INTERACTION = {{ENABLE_INTERACTION}};
var _interactStep = "action";
var _playedExpressions = {};
var _interactBusy = false;

function getAvailableExpressions(l) {
  if (!l || !l.data || !l.data.animations) return [];
  var allAnims = l.data.animations.map(function (a) { return a.name; });
  var targetKeywords = [
    "shy", "happy", "delight", "sad", "good", "no", "smile", "angry", "cry",
    "surprise", "surpris", "shock", "fear", "confus", "think", "laugh", "cheer", "wink", "proud", "panic"
  ];

  return allAnims.filter(function (name) {
    var low = name.toLowerCase();
    // 1. 严格排除 talk 系列（不单放张嘴动作）
    if (low.indexOf("talk") !== -1) return false;
    // 2. 严格排除 bg_ / 背景系列（如 bg_idle 等）
    if (low.indexOf("bg_") !== -1 || low.indexOf("bg") === 0 || low.indexOf("b_bg") !== -1 || low.indexOf("bk") !== -1) return false;
    // 3. 排除基础姿势与待机动作
    if (low === "idle" || low.indexOf("idle_") === 0 || low === "action" || low === "aim" || low === "cover") return false;
    // 4. 排除局部面部器官微调轨（避免只抽动鼻子/眨眼/眼珠/眼睫毛的非全身局部轨）
    if (low.indexOf("eye") !== -1 || low.indexOf("lash") !== -1 || low.indexOf("brow") !== -1 || low.indexOf("lip") !== -1 || low.indexOf("mouth") !== -1 || low.indexOf("tear") !== -1 || low.indexOf("blush") !== -1 || low.indexOf("nose") !== -1 || low.indexOf("ball") !== -1 || low.indexOf("ddam") !== -1 || low.indexOf("cheek") !== -1 || low.indexOf("_acc") !== -1) return false;
    // 5. 匹配表情核心词
    return targetKeywords.some(function (kw) {
      return low === kw || low.indexOf(kw) === 0 || (low.length >= kw.length && low.lastIndexOf(kw) === low.length - kw.length);
    });
  });
}

function triggerInteraction() {
  if (!ENABLE_INTERACTION || !skeletons.length || _interactBusy) return;
  var l0 = skeletons[0];
  var allAnimNames = l0.data.animations.map(function (a) { return a.name; });
  var idleAnim = pickAnim(l0.data);
  var actionAnim = allAnimNames.find(function (n) { return n.toLowerCase() === "action"; }) || allAnimNames.find(function (n) { return n.toLowerCase().indexOf("action") !== -1; });
  var expressions = getAvailableExpressions(l0);

  var targetAnim = "";
  var isAction = false;

  if (_interactStep === "action" || expressions.length === 0) {
    targetAnim = actionAnim || (expressions[0] || idleAnim);
    isAction = true;
    _interactStep = "expressions";
    _playedExpressions = {};
  } else {
    var remaining = expressions.filter(function (e) { return !_playedExpressions[e]; });
    if (remaining.length > 0) {
      var idx = Math.floor(Math.random() * remaining.length);
      targetAnim = remaining[idx];
      _playedExpressions[targetAnim] = true;

      var playedCount = Object.keys(_playedExpressions).length;
      if (playedCount >= expressions.length) {
        _interactStep = "action";
        _playedExpressions = {};
      }
    } else {
      targetAnim = actionAnim || idleAnim;
      isAction = true;
      _interactStep = "action";
      _playedExpressions = {};
    }
  }

  if (!targetAnim) return;

  _interactBusy = true;
  if (isAction) {
    // action 动作为一次性播放，播放完成后自动回切 idle 待机
    skeletons.forEach(function (l) {
      if (!l.skeleton) return;
      l.state.setAnimation(0, targetAnim, false);
      l.state.addAnimation(0, idleAnim, true, 0);
    });
    var animObj = l0.data.animations.find(function (a) { return a.name === targetAnim; });
    var duration = (animObj ? animObj.duration : 2.0) * 1000;
    setTimeout(function () {
      _interactBusy = false;
    }, Math.max(800, duration));
  } else {
    // 表情动作为持久播放（loop: true），一直保持直到下一次点击切换
    skeletons.forEach(function (l) {
      if (!l.skeleton) return;
      l.state.setAnimation(0, targetAnim, true);
    });
    setTimeout(function () {
      _interactBusy = false;
    }, 300);
  }
}

function isBgLayer(l) {
  // 多骨架分层兼容（NIKKE 单骨架时自动空转）
  if (!l || !l.skeleton || !l.name) return false;
  return /b(?:g)?\d*$/i.test(l.name.replace(/\.skel$/i, ''));
}

function buildScene() {
  skeletons = [];
  for (var i = 0; i < pending.length; i++) if (pending[i]) skeletons.push(pending[i]);
  playAnim(ANIMATION);
  // 把动画推进到 t=0，用初始姿态构建稳定的边界缓存（避免动画特效撑爆边界）
  skeletons.forEach(function (l) {
    l.state.update(0);
    l.state.apply(l.skeleton);
    l.skeleton.updateWorldTransform();
  });
  computeBounds();
  skeletons.forEach(function (l) {
    if (!l.skeleton) return;
    if (isBgLayer(l)) return;
    l.charBaseX = l.skeleton.x;
    l.charBaseY = l.skeleton.y;
  });
  applyLayout();
  lastFrame = performance.now() / 1000;
  canvas.classList.add("ready");
  requestAnimationFrame(render);
}

function layerBounds(l) {
  var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (var i = 0; i < l.skeleton.slots.length; i++) {
    var slot = l.skeleton.slots[i], att = slot.getAttachment();
    if (!att) continue;
    if (slot.color && slot.color.a < 0.01) continue;
    if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
    var isRegion = att instanceof spine.RegionAttachment;
    if (!isRegion && !(att instanceof spine.MeshAttachment) && !(att instanceof spine.BoundingBoxAttachment)) continue;
    var len = isRegion ? 8 : att.worldVerticesLength;
    if (!len) continue;
    var verts = spine.Utils.newFloatArray(len);
    if (isRegion) att.computeWorldVertices(slot, verts, 0, 2);
    else att.computeWorldVertices(slot, 0, len, verts, 0, 2);
    for (var j = 0; j < len; j += 2) {
      if (verts[j] < minX) minX = verts[j];
      if (verts[j] > maxX) maxX = verts[j];
      if (verts[j + 1] < minY) minY = verts[j + 1];
      if (verts[j + 1] > maxY) maxY = verts[j + 1];
    }
  }
  return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
}

function contentFrame() {
  // 按附件面积加权的网格密度取景：只框住内容密集区域，
  // 用于骨架包围盒被大面积背景网格/稀疏光效撑爆、角色被"挤"小的皮肤
  var raw = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  var items = [];
  skeletons.forEach(function (l) {
    for (var i = 0; i < l.skeleton.slots.length; i++) {
      var slot = l.skeleton.slots[i], att = slot.getAttachment();
      if (!att) continue;
      if (slot.color && slot.color.a < 0.01) continue;
      if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
      var isRegion = att instanceof spine.RegionAttachment;
      var isMesh = att instanceof spine.MeshAttachment;
      if (!isRegion && !isMesh) continue;
      var len = isRegion ? 8 : att.worldVerticesLength;
      if (!len) continue;
      var verts = spine.Utils.newFloatArray(len);
      if (isRegion) att.computeWorldVertices(slot, verts, 0, 2);
      else att.computeWorldVertices(slot, 0, len, verts, 0, 2);
      var b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      for (var j = 0; j < len; j += 2) {
        if (verts[j] < b.minX) b.minX = verts[j];
        if (verts[j] > b.maxX) b.maxX = verts[j];
        if (verts[j + 1] < b.minY) b.minY = verts[j + 1];
        if (verts[j + 1] > b.maxY) b.maxY = verts[j + 1];
      }
      items.push(b);
      if (b.minX < raw.minX) raw.minX = b.minX;
      if (b.maxX > raw.maxX) raw.maxX = b.maxX;
      if (b.minY < raw.minY) raw.minY = b.minY;
      if (b.maxY > raw.maxY) raw.maxY = b.maxY;
    }
  });
  if (!items.length) return null;
  var rawW = raw.maxX - raw.minX, rawH = raw.maxY - raw.minY;
  var N = 64;
  var gw = rawW / N || 1, gh = rawH / N || 1;
  var grid = new Float64Array(N * N);
  for (var k = 0; k < items.length; k++) {
    var bb = items[k];
    var cx = (bb.minX + bb.maxX) / 2, cy = (bb.minY + bb.maxY) / 2;
    var gx = Math.min(N - 1, Math.max(0, Math.floor((cx - raw.minX) / gw)));
    var gy = Math.min(N - 1, Math.max(0, Math.floor((cy - raw.minY) / gh)));
    grid[gy * N + gx] += Math.max(1, (bb.maxX - bb.minX) * (bb.maxY - bb.minY));
  }
  var maxCell = 0;
  for (var v = 0; v < grid.length; v++) if (grid[v] > maxCell) maxCell = grid[v];
  if (!maxCell) return null;
  var threshold = maxCell * 0.02;
  var fminX = raw.maxX, fmaxX = raw.minX, fminY = raw.maxY, fmaxY = raw.minY, kept = 0;
  for (var gy2 = 0; gy2 < N; gy2++) {
    for (var gx2 = 0; gx2 < N; gx2++) {
      if (grid[gy2 * N + gx2] >= threshold) {
        kept++;
        if (raw.minX + gx2 * gw < fminX) fminX = raw.minX + gx2 * gw;
        if (raw.minX + (gx2 + 1) * gw > fmaxX) fmaxX = raw.minX + (gx2 + 1) * gw;
        if (raw.minY + gy2 * gh < fminY) fminY = raw.minY + gy2 * gh;
        if (raw.minY + (gy2 + 1) * gh > fmaxY) fmaxY = raw.minY + (gy2 + 1) * gh;
      }
    }
  }
  var fW = fmaxX - fminX, fH = fmaxY - fminY;
  var ratioW = fW / rawW, ratioH = fH / rawH;
  if (!kept || ratioW > 0.55 || ratioH > 0.55 || ratioW < 0.08 || ratioH < 0.08) return null;
  var padX = fW * 0.15, padY = fH * 0.15;
  return { minX: fminX - padX, maxX: fmaxX + padX, minY: fminY - padY, maxY: fmaxY + padY };
}

function denseAreaFrame() {
  // 面积过滤取景：保留面积 ≤ 最大附件 40% 的部件，滤掉超大背景/云朵。
  var raw = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  var items = [];
  skeletons.forEach(function (l) {
    for (var i = 0; i < l.skeleton.slots.length; i++) {
      var slot = l.skeleton.slots[i], att = slot.getAttachment();
      if (!att) continue;
      if (slot.color && slot.color.a < 0.01) continue;
      if ((att.name || '').toLowerCase().indexOf('kkkkk') === 0) continue;
      var isRegion = att instanceof spine.RegionAttachment;
      var isMesh = att instanceof spine.MeshAttachment;
      if (!isRegion && !isMesh) continue;
      var len = isRegion ? 8 : att.worldVerticesLength;
      if (!len) continue;
      var verts = spine.Utils.newFloatArray(len);
      if (isRegion) att.computeWorldVertices(slot, verts, 0, 2);
      else att.computeWorldVertices(slot, 0, len, verts, 0, 2);
      var b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      for (var j = 0; j < len; j += 2) {
        if (verts[j] < b.minX) b.minX = verts[j];
        if (verts[j] > b.maxX) b.maxX = verts[j];
        if (verts[j + 1] < b.minY) b.minY = verts[j + 1];
        if (verts[j + 1] > b.maxY) b.maxY = verts[j + 1];
      }
      items.push(b);
      if (b.minX < raw.minX) raw.minX = b.minX;
      if (b.maxX > raw.maxX) raw.maxX = b.maxX;
      if (b.minY < raw.minY) raw.minY = b.minY;
      if (b.maxY > raw.maxY) raw.maxY = b.maxY;
    }
  });
  if (!items.length) return null;
  var rawW = raw.maxX - raw.minX, rawH = raw.maxY - raw.minY;
  var areas = items.map(function (b) { return (b.maxX - b.minX) * (b.maxY - b.minY); });
  var maxA = Math.max.apply(null, areas);
  if (maxA >= rawW * rawH * 0.8) return null;
  var keep = items.filter(function (b, i) { return areas[i] <= maxA * 0.4; });
  if (!keep.length) return null;
  var N = 64;
  var gw = rawW / N || 1, gh = rawH / N || 1;
  var grid = new Float64Array(N * N);
  for (var k = 0; k < keep.length; k++) {
    var bb = keep[k];
    var cx = (bb.minX + bb.maxX) / 2, cy = (bb.minY + bb.maxY) / 2;
    var gx = Math.min(N - 1, Math.max(0, Math.floor((cx - raw.minX) / gw)));
    var gy = Math.min(N - 1, Math.max(0, Math.floor((cy - raw.minY) / gh)));
    grid[gy * N + gx] += Math.max(1, (bb.maxX - bb.minX) * (bb.maxY - bb.minY));
  }
  var maxCell = 0;
  for (var v = 0; v < grid.length; v++) if (grid[v] > maxCell) maxCell = grid[v];
  if (!maxCell) return null;
  var threshold = maxCell * 0.02;
  var fminX = raw.maxX, fmaxX = raw.minX, fminY = raw.maxY, fmaxY = raw.minY, keptCells = 0;
  for (var gy2 = 0; gy2 < N; gy2++) {
    for (var gx2 = 0; gx2 < N; gx2++) {
      if (grid[gy2 * N + gx2] >= threshold) {
        keptCells++;
        if (raw.minX + gx2 * gw < fminX) fminX = raw.minX + gx2 * gw;
        if (raw.minX + (gx2 + 1) * gw > fmaxX) fmaxX = raw.minX + (gx2 + 1) * gw;
        if (raw.minY + gy2 * gh < fminY) fminY = raw.minY + gy2 * gh;
        if (raw.minY + (gy2 + 1) * gh > fmaxY) fmaxY = raw.minY + (gy2 + 1) * gh;
      }
    }
  }
  var fW = fmaxX - fminX, fH = fmaxY - fminY;
  if (!keptCells || fW >= rawW * 0.9 || fH >= rawH * 0.9) return null;
  var padX = fW * 0.12, padY = fH * 0.12;
  return { minX: fminX - padX, maxX: fmaxX + padX, minY: fminY - padY, maxY: fmaxY + padY };
}

function computeBounds() {
  // 与预览 SpinePreview.vue 完全一致的取景链：contentFrame → denseAreaFrame → 兜底。
  if (boundsCache) return boundsCache;
  var dense = contentFrame();
  if (dense) { boundsCache = dense; return boundsCache; }
  var areaFrame = denseAreaFrame();
  if (areaFrame) { boundsCache = areaFrame; return boundsCache; }
  var per = [];
  skeletons.forEach(function (l) {
    l.skeleton.updateWorldTransform();
    var b = layerBounds(l);
    if (isFinite(b.minX)) per.push(b);
  });
  if (!per.length) { boundsCache = { minX: -1, maxX: 1, minY: -1, maxY: 1 }; return boundsCache; }
  var small = per[0];
  for (var k = 1; k < per.length; k++) {
    var a = (per[k].maxX - per[k].minX) * (per[k].maxY - per[k].minY);
    var ra = (small.maxX - small.minX) * (small.maxY - small.minY);
    if (a < ra) small = per[k];
  }
  var baseArea = (small.maxX - small.minX) * (small.maxY - small.minY) || 1;
  var frame = per.filter(function (b) {
    return (b.maxX - b.minX) * (b.maxY - b.minY) <= baseArea * 4;
  });
  boundsCache = {
    minX: Math.min.apply(null, frame.map(function (b) { return b.minX; })),
    maxX: Math.max.apply(null, frame.map(function (b) { return b.maxX; })),
    minY: Math.min.apply(null, frame.map(function (b) { return b.minY; })),
    maxY: Math.max.apply(null, frame.map(function (b) { return b.maxY; })),
  };
  return boundsCache;
}

function applyLayout() {
  if (!skeletons.length || !renderer) return;
  var a = WallpaperLayout.anchor(ALIGNMENT);
  var cam = WallpaperLayout.spineCamera(computeBounds(), canvas.clientWidth, canvas.clientHeight, {
    scale: SCALE,
    offsetX: OFFSET_X,
    offsetY: OFFSET_Y,
    alignX: a.x,
    alignY: a.y
  });
  renderer.camera.zoom = cam.zoom;
  renderer.camera.position.x = cam.x;
  renderer.camera.position.y = cam.y;
  renderer.camera.position.z = 0;
}

function render() {
  try {
    var now = performance.now() / 1000;
    var delta = Math.min(0.1, now - lastFrame);
    lastFrame = now;
    if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
      canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
      gl.viewport(0, 0, canvas.width, canvas.height);
      renderer.camera.setViewport(canvas.width, canvas.height);
      applyLayout();
    }
    var _charOff = WallpaperLayout.charOffsetWorld(CHAR_OFFSET_X, CHAR_OFFSET_Y, canvas.clientWidth, canvas.clientHeight, renderer.camera.zoom);
    skeletons.forEach(function (l) {
      try {
        if (!isBgLayer(l)) {
          l.skeleton.x = (l.charBaseX !== undefined ? l.charBaseX : l.skeleton.x) + _charOff.x;
          l.skeleton.y = (l.charBaseY !== undefined ? l.charBaseY : l.skeleton.y) + _charOff.y;
        } else if (l.charBaseX !== undefined) {
          l.skeleton.x = l.charBaseX;
          l.skeleton.y = l.charBaseY;
        }
        l.state.update(delta);
        l.state.apply(l.skeleton);
        l.skeleton.updateWorldTransform();
      } catch (e) { console.error("[spine] 层动画异常: " + (l.name || "") + " " + (e && e.message)); }
    });
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    renderer.begin();
    renderer.drawSkeleton(skeletons[0].skeleton, true);
    renderer.end();
  } catch (e) {
    console.error("[spine] 渲染帧异常: " + (e && e.message || e));
  }
  requestAnimationFrame(render);
}

// WE 加载时会先推送一次"全部属性"（含 config.json 里按路径存的历史覆盖值）。
// 版式（SCALE/OFFSET/ALIGNMENT）一律跳过首推，以导出内联值为准（预览=导出一致）；
// 之后用户在 WE 里手动拖滑块仍会推增量并生效。
var _initialPropsApplied = false;
window.wallpaperPropertyListener = {
  applyUserProperties: function (properties) {
    try {
      if (!_initialPropsApplied) {
        _initialPropsApplied = true;
        if (skeletons.length) applyLayout();
        return;
      }
      if (properties.scalectrl) SCALE = properties.scalectrl.value;
      if (properties.offsetx) OFFSET_X = properties.offsetx.value;
      if (properties.offsety) OFFSET_Y = properties.offsety.value;
      if (properties.interaction !== undefined) {
        ENABLE_INTERACTION = Boolean(properties.interaction.value);
        if (!ENABLE_INTERACTION && skeletons.length) {
          var idleAnim = pickAnim(skeletons[0].data);
          skeletons.forEach(function (l) {
            if (l.skeleton) l.state.setAnimation(0, idleAnim, true);
          });
          _interactStep = "action";
          _playedExpressions = {};
          _interactBusy = false;
        }
      }
      if (properties.alignment) {
        var av = properties.alignment.value;
        if (typeof av === "number") ALIGNMENT = WallpaperLayout.ALIGN_ORDER[av] || ALIGNMENT;
        else if (typeof av === "string") ALIGNMENT = av;
      }
      if (skeletons.length) applyLayout();
    } catch (e) {}
  }
};

window.__captureCanvasDataURL = function () {
  try { return canvas.toDataURL("image/png"); } catch (e) { return ""; }
};

function init() {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  gl = canvas.getContext("webgl", { alpha: true }) || canvas.getContext("experimental-webgl", { alpha: true });
  if (!gl) { showError("WebGL not supported"); return; }
  renderer = new spine.SceneRenderer(canvas, gl, false);
  for (var i = 0; i < LAYERS.length; i++) loadLayer(i);

  var _downX = 0, _downY = 0;
  canvas.addEventListener("mousedown", function(e) {
    if (e.button !== 0) return;
    _downX = e.clientX; _downY = e.clientY;
  });
  canvas.addEventListener("mouseup", function(e) {
    if (e.button !== 0) return;
    var dist = Math.hypot(e.clientX - _downX, e.clientY - _downY);
    if (dist < 6) {
      triggerInteraction();
    }
  });
}
window.addEventListener("resize", function () {
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  if (renderer) { gl.viewport(0, 0, canvas.width, canvas.height); renderer.camera.setViewport(canvas.width, canvas.height); }
  if (skeletons.length) applyLayout();
});
window.addEventListener("load", init);
</script>
</body>
</html>
